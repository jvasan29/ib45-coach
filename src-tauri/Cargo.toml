[package]
name = "ib45-coach"
version = "0.2.3"
description = "A local-first accountability and planning coach for IB Diploma students"
authors = ["Jay"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ib45_coach_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
fs2 = "0.4"
hex = "0.4"
keyring = { version = "4.1", features = ["v1"] }
open = "5"
pdf-extract = "0.9"
quick-xml = "0.38"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "chrono"] }
sha2 = "0.10"
sysinfo = "0.37"
tokio = { version = "1", features = ["time", "rt-multi-thread", "sync"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
